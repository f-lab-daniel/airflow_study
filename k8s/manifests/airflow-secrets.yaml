# Airflow 컴포넌트가 공유하는 보안 키 (values.yaml의 apiSecretKeySecretName, jwtSecretName)
#
# 실습용 고정 값입니다. 운영 환경에서는 이 파일을 쓰지 말고 무작위 값으로 직접 만드세요:
#   kubectl create secret generic airflow-api-secret -n airflow \
#     --from-literal=api-secret-key="$(openssl rand -hex 32)"
#   kubectl create secret generic airflow-jwt-secret -n airflow \
#     --from-literal=jwt-secret="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: airflow-api-secret
  namespace: airflow
type: Opaque
stringData:
  api-secret-key: change-me-airflow-study-api-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-jwt-secret
  namespace: airflow
type: Opaque
stringData:
  jwt-secret: change-me-airflow-study-jwt-secret
