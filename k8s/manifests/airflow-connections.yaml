# DAG에서 사용하는 Connection / Variable
# values.yaml의 extraEnvFrom으로 모든 Airflow 컨테이너에 환경 변수로 주입됩니다.
#   AIRFLOW_CONN_<CONN_ID 대문자> → Connection
#   AIRFLOW_VAR_<KEY 대문자>      → Variable
# 환경 변수로 등록한 값은 메타 DB에 저장되지 않아 UI의 Admin 목록에는 보이지 않습니다.
apiVersion: v1
kind: Secret
metadata:
  name: airflow-connections
  namespace: airflow
type: Opaque
stringData:
  # 2_postgres_loader.py, 3_http_dag.py → manifests/study-db.yaml의 study-db Service
  AIRFLOW_CONN_MY_POSTGRES_CONNECTION: '{"conn_type": "postgres", "host": "study-db", "port": 5432, "login": "study_user", "password": "study_pass", "schema": "study_db"}'
  # 3_http_dag.py
  AIRFLOW_CONN_MY_HTTP_CONNECTION: '{"conn_type": "http", "host": "swapi.dev", "schema": "https"}'
  # 9_access_variable.py
  AIRFLOW_VAR_VAR1: value1
  AIRFLOW_VAR_VAR2: value2
  AIRFLOW_VAR_VAR_DICT: '{"var1": "value1", "var2": "value2"}'
