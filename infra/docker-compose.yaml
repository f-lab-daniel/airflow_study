# 로컬 실습 인프라: PostgreSQL 17 + Redis
# - airflow_db : Airflow 메타데이터 DB (A, B 방법)
# - study_db   : DAG 실습 DB (A, B, C 방법 공통)
# - redis      : Celery 브로커 (B 방법)
#
# 실행: docker compose -f infra/docker-compose.yaml up -d
# 정리: docker compose -f infra/docker-compose.yaml down -v
name: airflow-study-infra

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      # 볼륨이 비어 있을 때(최초 실행)만 실행됩니다
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.2-bookworm
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
